<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, must-revalidate">
<title>animalysson RPG</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@500;700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#121212;--card:#1e1e20;--ink:#f2f2f2;--mute:#a0a0a6;--line:#3a3a3f;--red:#c53131;--redink:#fff;--ok:#5bbf8f;--paper:#1a1a1c;--box:#252528}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.45 Roboto,system-ui,sans-serif;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
h1,h2,h3{font-family:"Roboto Condensed",system-ui,sans-serif;font-weight:700;margin:0 0 .4em;letter-spacing:.01em}
h1{font-size:1.8rem}h2{font-size:1.3rem}h3{font-size:1rem}
main{max-width:1100px;margin:0 auto;padding:16px 12px 60px}
.steps{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0 16px}
.steps button{flex:1;min-width:100px;padding:8px 8px;border:1px solid var(--line);background:var(--card);color:var(--mute);border-radius:6px;font:inherit;cursor:pointer;font-size:.9rem}
.steps button.on{background:var(--red);border-color:var(--red);color:var(--redink);font-weight:700}
.steps button.done{color:var(--ok);border-color:var(--ok)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.opt{padding:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:6px;text-align:left;font:inherit;cursor:pointer}
.opt b{display:block;font-family:"Roboto Condensed",system-ui,sans-serif}
.opt small{color:var(--mute)}
.opt.sel{border:2px solid var(--red);padding:9px}
input,select,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:7px 9px;max-width:100%}
:focus-visible{outline:3px solid var(--red);outline-offset:2px}
.row{display:flex;gap:12px;flex-wrap:wrap;margin:10px 0}
.row>label{flex:1;min-width:180px;display:flex;flex-direction:column;gap:4px}
.info{margin-top:12px;padding:12px;border-left:4px solid var(--red);background:var(--bg);border-radius:0 6px 6px 0}
.info p{margin:.2em 0}
.ab{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px;margin:12px 0}
.abc{border:1px solid var(--line);border-radius:8px;padding:10px;text-align:center;background:var(--bg)}
.abc .v{font-family:"Roboto Condensed",system-ui,sans-serif;font-size:1.8rem;line-height:1.1}
.abc .m{color:var(--mute)}
.abc .ctl{display:flex;justify-content:center;gap:6px;margin-top:6px;align-items:center}
.abc select,.abc input{width:72px;text-align:center}
.pm{width:30px;height:30px;border-radius:6px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;cursor:pointer}
.pm:disabled{opacity:.35;cursor:default}
.nav{display:flex;justify-content:space-between;flex-wrap:wrap;margin-bottom:14px;gap:10px}
.btn{padding:10px 18px;border-radius:6px;border:1px solid var(--red);background:var(--red);color:var(--redink);font:inherit;font-weight:700;cursor:pointer}
.btn.alt{background:transparent;color:var(--red)}
.btn:disabled{opacity:.4;cursor:default}
.warn{color:var(--red);font-weight:500}
.sk{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:6px}
.sk label{display:flex;gap:8px;align-items:center;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--bg)}
.sk label.lock{opacity:.6}
.split{display:grid;grid-template-columns:240px 1fr;gap:14px;margin-top:12px}
.side{display:flex;flex-direction:column;gap:4px;max-height:480px;overflow-y:auto}
.item{display:flex;justify-content:space-between;align-items:center;padding:11px 12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:6px;font:inherit;cursor:pointer;text-align:left}
.item.sel{border-color:var(--red);background:var(--card);box-shadow:inset 4px 0 0 var(--red)}
.detail{border:1px solid var(--line);border-radius:8px;padding:16px;background:var(--bg)}
.detail .stat{margin:12px 0}
.race-search{width:100%;margin:8px 0 10px}
.race-count{color:var(--mute);font-size:.9rem;margin:0 0 8px}
.stat{display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:8px}
.stat div{border:1px solid var(--line);border-radius:8px;padding:8px;text-align:center;background:var(--bg)}
.stat b{display:block;font-family:"Roboto Condensed",system-ui,sans-serif;font-size:1.4rem}
.list{margin:0;padding:0;list-style:none}
.list li{display:flex;justify-content:space-between;padding:3px 0;border-bottom:1px dotted var(--line)}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;border:1px solid var(--ink);margin-right:6px}
.dot.p{background:var(--red);border-color:var(--red)}

/* Official-style sheet */
.ficha{background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:10px;display:grid;gap:8px}
.ficha *{font-size:.82rem}
.ficha .lbl{font-size:.65rem;text-transform:uppercase;letter-spacing:.04em;color:var(--mute);font-weight:700}
.box{border:1px solid var(--line);border-radius:6px;background:var(--box);padding:6px 8px;position:relative}
.box.clickable{cursor:pointer;transition:border-color .12s,box-shadow .12s}
.box.clickable:hover{border-color:var(--red);box-shadow:0 0 0 1px var(--red)}
.box .edit{position:absolute;top:4px;right:6px;font-size:.6rem;color:var(--mute);opacity:0;transition:opacity .12s}
.box.clickable:hover .edit{opacity:1;color:var(--red)}
.f-top{display:grid;grid-template-columns:1.4fr 1fr .9fr;gap:8px}
.f-fields{display:grid;gap:6px}
.f-fields .row2{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.f-field{display:flex;flex-direction:column;gap:2px}
.f-field.clickable{position:relative;cursor:pointer;padding:4px 6px;border:1px solid transparent;border-radius:6px;transition:border-color .12s,box-shadow .12s}
.f-field.clickable:hover{border-color:var(--red);box-shadow:0 0 0 1px var(--red)}
.f-field .edit{position:absolute;top:3px;right:6px;font-size:.6rem;color:var(--mute);opacity:0;transition:opacity .12s}
.f-field.clickable:hover .edit{opacity:1;color:var(--red)}
.f-field .val{font-family:"Roboto Condensed",system-ui,sans-serif;font-size:1rem;font-weight:700;min-height:1.3em}
.f-combat{display:grid;grid-template-columns:70px 1fr 70px;gap:6px;align-items:stretch}
.f-ac{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.f-ac .big{font-family:"Roboto Condensed",system-ui,sans-serif;font-size:1.8rem;font-weight:700;line-height:1}
.f-hp{display:grid;grid-template-columns:1fr 1fr;gap:4px}
.f-hp .cell{text-align:center;padding:4px;border:1px solid var(--line);border-radius:4px}
.f-hp .big{font-family:"Roboto Condensed",system-ui,sans-serif;font-size:1.3rem;font-weight:700}
.f-mid{display:grid;grid-template-columns:90px 1fr;gap:8px}
.f-abilities{display:flex;flex-direction:column;gap:6px}
.ability{display:grid;grid-template-columns:1fr;gap:2px;text-align:center;padding:6px 4px}
.ability .name{font-size:.7rem;font-weight:700;letter-spacing:.03em}
.ability .score{font-family:"Roboto Condensed",system-ui,sans-serif;font-size:1.5rem;font-weight:700;line-height:1}
.ability .mod{font-size:.95rem;color:var(--mute)}
.ability .sv{font-size:.7rem;margin-top:2px}
.f-center{display:grid;gap:8px}
.f-stats-row{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.f-stats-row .box{text-align:center;padding:8px 4px}
.f-stats-row .big{font-family:"Roboto Condensed",system-ui,sans-serif;font-size:1.2rem;font-weight:700}
.f-skills{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.skill-col{display:flex;flex-direction:column;gap:2px}
.skill-row{display:flex;align-items:center;gap:6px;padding:2px 0;border-bottom:1px dotted var(--line)}
.skill-row .nm{flex:1}
.skill-row .bon{font-weight:700;min-width:2.2em;text-align:right}
.f-bottom{display:grid;grid-template-columns:1fr;gap:8px}
.f-features{min-height:80px}
.f-features p{margin:.3em 0}
.prof-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.prof-badge{display:inline-flex;align-items:center;justify-content:center;width:36px;height:36px;border:2px solid var(--line);border-radius:50%;font-family:"Roboto Condensed",system-ui,sans-serif;font-weight:700;font-size:1rem}

/* Modal */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.65);display:flex;align-items:flex-start;justify-content:center;padding:24px 12px;z-index:100;overflow-y:auto}
.modal{background:var(--card);border:1px solid var(--line);border-radius:10px;width:100%;max-width:640px;padding:18px;margin:auto;box-shadow:0 12px 40px rgba(0,0,0,.45)}
.modal h2{margin-bottom:12px}
.modal .modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:16px;flex-wrap:wrap}
.modal .close-x{float:right;background:none;border:none;color:var(--mute);font-size:1.4rem;cursor:pointer;line-height:1;padding:0 4px}
.modal .close-x:hover{color:var(--ink)}

@media (max-width:800px){
  .f-top{grid-template-columns:1fr}
  .f-mid{grid-template-columns:1fr}
  .f-abilities{flex-direction:row;flex-wrap:wrap}
  .ability{flex:1 1 90px}
  .f-skills,.f-bottom{grid-template-columns:1fr}
  .f-stats-row{grid-template-columns:repeat(2,1fr)}
  .split{grid-template-columns:1fr}
  .side{max-height:none;flex-direction:row;flex-wrap:wrap}
  .item{flex:1 1 120px}
}
@media print{
  .steps,.nav,.modal-bg{display:none!important}
  body{background:#fff;color:#000}
  .panel,.ficha,.box{border-color:#999;background:#fff}
  main{max-width:none;padding:0}
}

/* Main section navigation and visual catalogs */
.site-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:4px 0 14px}
.site-head h1{margin:0}.subtitle{color:var(--mute);margin:2px 0 0;font-size:.9rem}.head-actions{display:flex;gap:8px}
.section-tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0 18px;position:sticky;top:0;z-index:20;padding:8px 0;background:var(--bg)}
.section-tab{border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--mute);font:inherit;font-weight:700;padding:12px 10px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:9px;transition:.15s}
.section-tab span{font-size:1.2rem}.section-tab.on{background:var(--red);border-color:var(--red);color:#fff}.section-tab:hover{border-color:var(--red);color:var(--ink)}.section-tab.on:hover{color:#fff}
.catalog-head{display:flex;justify-content:space-between;align-items:end;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.catalog-head p{margin:3px 0 0;color:var(--mute)}
.catalog-tools{display:grid;grid-template-columns:minmax(220px,1fr) minmax(160px,240px);gap:8px;margin:14px 0}
.catalog-tools input,.catalog-tools select{width:100%;min-width:0;padding:10px 12px}
.catalog-count{font-size:.85rem;color:var(--mute);margin:6px 0 10px}
.catalog-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(185px,1fr));gap:10px;align-items:stretch}
.catalog-card{appearance:none;text-align:left;background:linear-gradient(145deg,var(--card),var(--bg));border:1px solid var(--line);color:var(--ink);border-radius:9px;padding:13px;cursor:pointer;min-height:116px;display:flex;flex-direction:column;gap:8px;transition:border-color .15s,transform .15s,box-shadow .15s}
.catalog-card:hover{border-color:var(--red);transform:translateY(-2px);box-shadow:0 6px 18px #0004}.catalog-card.sel{border-color:var(--red);box-shadow:inset 0 0 0 1px var(--red)}
.card-topline{display:flex;justify-content:space-between;align-items:center;gap:8px}.card-icon{width:34px;height:34px;border-radius:8px;display:grid;place-items:center;background:#c5313122;color:#ff7777;font-size:1.2rem;flex:none}
.card-tag{font-size:.69rem;color:var(--mute);border:1px solid var(--line);border-radius:20px;padding:3px 7px;white-space:nowrap}.catalog-card strong{font-family:"Roboto Condensed",system-ui,sans-serif;font-size:1.05rem;line-height:1.2}.catalog-card small{color:var(--mute);line-height:1.3}.card-stats{display:flex;flex-wrap:wrap;gap:5px;margin-top:auto}.card-stats span{font-size:.75rem;padding:3px 6px;border-radius:5px;background:var(--box);color:var(--mute)}
.catalog-layout{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(300px,.9fr);gap:14px;align-items:start}
.catalog-detail{background:var(--paper);border:1px solid var(--line);border-radius:9px;padding:16px;min-height:230px;position:sticky;top:76px;max-height:calc(100vh - 100px);overflow:auto}
.catalog-detail h2{margin:0 0 5px}.catalog-detail h3{margin:16px 0 7px;color:#e6aaaa;border-bottom:1px solid var(--line);padding-bottom:5px}
.detail-sub{color:var(--mute);margin:0 0 12px;font-size:.88rem}.detail-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:7px;margin:12px 0}
.detail-stat{background:var(--box);border:1px solid var(--line);border-radius:7px;padding:8px;text-align:center}.detail-stat b{display:block;font:700 1.3rem "Roboto Condensed",sans-serif}.detail-stat small{color:var(--mute);font-size:.7rem;text-transform:uppercase}
.detail-line{padding:7px 0;border-bottom:1px dotted var(--line);font-size:.86rem}.detail-line b{color:var(--ink)}.detail-note{background:var(--box);border-left:3px solid var(--red);padding:9px 11px;border-radius:0 6px 6px 0;color:#ddd;font-size:.85rem;margin-top:12px}
.detail-entries{display:grid;gap:8px}.detail-entry{padding:9px 10px;background:var(--box);border:1px solid var(--line);border-radius:7px}.detail-entry b{display:block;margin-bottom:4px}.detail-entry p{margin:0;color:#ddd;font-size:.84rem;white-space:pre-wrap}
.empty-state{border:1px dashed var(--line);border-radius:9px;padding:28px;text-align:center;color:var(--mute);background:var(--bg)}
.source-note{font-size:.75rem;color:var(--mute);margin-top:10px}
.character-toolbar{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}.character-toolbar p{margin:0;color:var(--mute);font-size:.85rem}
@media(max-width:820px){.catalog-layout{grid-template-columns:1fr}.catalog-detail{position:static;max-height:none}.catalog-grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}}
@media(max-width:520px){main{padding:12px 9px 40px}.site-head h1{font-size:1.45rem}.head-actions .btn{padding:8px 10px}.section-tabs{gap:5px}.section-tab{padding:10px 4px;font-size:.82rem;gap:5px}.catalog-tools{grid-template-columns:1fr}.catalog-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.catalog-card{padding:10px;min-height:112px}.catalog-detail{padding:12px}}
@media print{.section-tabs,.head-actions,.catalog-tools{display:none!important}.catalog-detail{position:static;max-height:none}}


.item-description{margin-top:18px;padding-top:14px;border-top:1px solid var(--line)}.item-description h3{margin:0 0 10px;font-size:1rem}.item-description p{line-height:1.55}.detail-hint{color:var(--mute);font-size:.82rem}.rules-copy{line-height:1.55;overflow-wrap:anywhere}.rules-copy h3,.rules-copy h4,.rules-copy h5{margin:14px 0 6px}.rules-copy ul{padding-left:20px}.rules-copy li{margin:4px 0}.rules-table{width:100%;border-collapse:collapse;margin:10px 0;font-size:.88rem}.rules-table td{border:1px solid var(--line);padding:6px;vertical-align:top}.original-details{margin-top:12px}.original-details pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:.75rem;background:var(--panel2);padding:10px;border-radius:8px}.catalog-card .card-stats{flex-wrap:wrap;gap:6px}.catalog-card .card-stats span{font-size:.76rem}
</style>
</head>
<body>
<main>
<header class="site-head">
  <div><h1>animalysson RPG</h1><p class="subtitle">Personagem · Itens · Monstros</p></div>
  
</header>
<nav class="section-tabs" aria-label="Seções principais">
  <button id="tab-character" class="section-tab on" onclick="switchView('character')"><span>♙</span> Personagem</button>
  <button id="tab-items" class="section-tab" onclick="switchView('items')"><span>⚒</span> Itens</button>
  <button id="tab-monsters" class="section-tab" onclick="switchView('monsters')"><span>♜</span> Monstros</button>
</nav>
<div class="steps" id="steps" style="display:none"></div>
<div id="app"></div>
</main>
<div id="modal-root"></div>
<script>
/* Carrega os catálogos sempre com um parâmetro novo na URL, para o navegador
   nunca reaproveitar uma versão antiga dos .js em cache. */
['especies.js','classes.js','antecedentes.js','spells.js','itens.js','monsters.js'].forEach(function(f){
  document.write('<script src="'+f+'?v='+Date.now()+'"><\/script>');
});
</script>
<script>
const SP=window.SPECIES;
const CL=window.CLASSES;
const CLD=window.CLASS_DESC;
const BG=window.BACKGROUNDS;
const SPELLS=window.SPELLS;
const ITEMS=window.ITEMS;
const MAGIC_ITEMS=window.MAGIC_ITEMS;
let ACTIVE_VIEW='character';
let ITEM_QUERY='';
let ITEM_CATEGORY='Todas';
let SELECTED_ITEM_INDEX=0;
let MONSTER_QUERY='';
let MONSTER_TYPE='Todos';
let SELECTED_MONSTER_ID=null;
let MONSTER_CACHE=[];
if(!Array.isArray(SP)||!SP.length)throw new Error('Não foi possível carregar especies.js');
if(!Array.isArray(CL)||!CL.length)throw new Error('Não foi possível carregar classes.js');
if(!Array.isArray(BG)||!BG.length)throw new Error('Não foi possível carregar antecedentes.js');
if(!Array.isArray(SPELLS)||!SPELLS.length)throw new Error('Não foi possível carregar spells.js');
if(!Array.isArray(ITEMS)||!ITEMS.length)throw new Error('Não foi possível carregar itens.js');
const AB=['FOR','DES','CON','INT','SAB','CAR'];
const ABN={FOR:'Força',DES:'Destreza',CON:'Constituição',INT:'Inteligência',SAB:'Sabedoria',CAR:'Carisma'};
const SK={'Acrobacia':'DES','Adestrar Animais':'SAB','Arcanismo':'INT','Atletismo':'FOR','Atuação':'CAR','Enganação':'CAR','Furtividade':'DES','História':'INT','Intimidação':'CAR','Intuição':'SAB','Investigação':'INT','Medicina':'SAB','Natureza':'INT','Percepção':'SAB','Persuasão':'CAR','Prestidigitação':'DES','Religião':'INT','Sobrevivência':'SAB'};
const ALL=Object.keys(SK);
const SK_BY_AB={FOR:['Atletismo'],DES:['Acrobacia','Prestidigitação','Furtividade'],CON:[],INT:['Arcanismo','História','Investigação','Natureza','Religião'],SAB:['Adestrar Animais','Intuição','Medicina','Percepção','Sobrevivência'],CAR:['Atuação','Enganação','Intimidação','Persuasão']};
CL.forEach(c=>{if(c.l===null)c.l=ALL});
const STD=[15,14,13,12,10,8], COST={8:0,9:1,10:2,11:3,12:4,13:5,14:7,15:9};
// ====== ESTADO INICIAL ZERADO ======
const S={
  step:0,
  name:'',
  cls:null,
  sp:null,
  bg:null,
  mode:'21',
  p2:'',
  p1:'',
  method:'std',
  raceQuery:'',
  std:{},
  pb:{FOR:8,DES:8,CON:8,INT:8,SAB:8,CAR:8},
  man:{FOR:10,DES:10,CON:10,INT:10,SAB:10,CAR:10},
  skills:[],
  rolled:[],
  lang:[],
  align:'',
  modal:null
};
const mod=s=>Math.floor((s-10)/2), fmt=n=>(n>=0?'+':'')+n;
const spent=()=>AB.reduce((t,a)=>t+COST[S.pb[a]],0);
function base(a){return (S.method==='std'||S.method==='rnd')?(S.std[a]??10):S.method==='pb'?S.pb[a]:S.man[a]}
function bonus(a){if(S.bg===null)return 0;const b=BG[S.bg];if(!b.a.includes(a))return 0;return S.mode==='111'?1:(a===S.p2?2:a===S.p1?1:0)}
const score=a=>Math.min(20,base(a)+bonus(a));
function pool(){return S.method==='std'?STD:S.rolled}
function stdOk(){const p=pool().slice().sort().join(),v=AB.map(a=>S.std[a]);return v.every(Boolean)&&v.slice().sort().join()===p}
function manOk(){return AB.every(a=>S.man[a]>=3&&S.man[a]<=18)}
function valid(i){if(i===0)return S.sp!==null;if(i===1)return S.cls!==null;if(i===2)return S.bg!==null&&(S.mode==='111'||(S.p2&&S.p1&&S.p2!==S.p1));if(i===3)return (S.method==='std'||S.method==='rnd')?stdOk():S.method==='man'?manOk():spent()<=27;if(i===4)return S.cls!==null&&S.skills.length===CL[S.cls].k;if(i===5)return S.lang.length===2&&S.align!=='';return true}
const NAMES=['Espécie','Classe','Antecedente','Atributos','Perícias','Detalhes','Ficha'];
function go(i){if(i<0)return;for(let j=0;j<i;j++)if(!valid(j))return;S.step=i;S.modal=null;render()}
function set(k,v){S[k]=v;if(k==='method')S.std={};if(k==='cls')S.skills=[];if(k==='bg'){S.p2='';S.p1=''}render()}
function mapset(m,a,v){S[m][a]=+v;render()}
function pm(a,d){const n=S.pb[a]+d;if(n<8||n>15)return;S.pb[a]=n;render()}
function togSkill(k){if(S.cls===null)return;const i=S.skills.indexOf(k);if(i>=0)S.skills.splice(i,1);else if(S.skills.length<CL[S.cls].k)S.skills.push(k);render()}
function sel(id,opts,cur,fn,ph){return `<select id="${id}" onchange="${fn}">`+`<option value="">${ph}</option>`+opts.map(o=>`<option value="${o[0]}"${String(o[0])===String(cur)?' selected':''}>${o[1]}</option>`).join('')+'</select>'}
function norm(s){return String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase()}
const SUG={'Artífice':[8,13,14,15,12,10],'Bárbaro':[15,13,14,10,12,8],'Bardo':[8,14,12,13,10,15],'Clérigo':[14,8,13,10,15,12],'Druida':[8,12,14,13,15,10],'Guerreiro':[15,14,13,8,10,12],'Monge':[12,15,13,10,14,8],'Paladino':[15,10,13,8,12,14],'Guardião':[12,15,13,8,14,10],'Ladino':[12,15,13,14,10,8],'Feiticeiro':[10,13,14,8,12,15],'Bruxo':[8,14,13,12,10,15],'Mago':[8,12,13,15,14,10]};
const SC={'Artífice':'INT','Bardo':'CAR','Bruxo':'CAR','Clérigo':'SAB','Druida':'SAB','Feiticeiro':'CAR','Guardião':'SAB','Mago':'INT','Paladino':'CAR'};
const ALN=['Leal e Bom','Neutro e Bom','Caótico e Bom','Leal e Neutro','Neutro','Caótico e Neutro','Leal e Mau','Neutro e Mau','Caótico e Mau'];
const LANG=['Língua de Sinais Comum','Dracônico','Anão','Élfico','Gigante','Gnômico','Goblin','Halfling','Orc'];

function openModal(m){S.modal=m;render()}
function closeModal(){S.modal=null;render()}

function vRaca(){
 let h=`<label>Nome do personagem<br><input value="${S.name.replace(/"/g,'&quot;')}" oninput="S.name=this.value" placeholder="Ex.: Thorin"></label>
 <h2 style="margin-top:16px">Escolha uma espécie</h2>
 <div class="split"><div class="side">`;
 SP.forEach((s,i)=>{h+=`<button class="item${S.sp===i?' sel':''}" onclick="set('sp',${i})"><span>${s.n}</span></button>`});
 h+='</div><div class="detail">';
 if(S.sp===null)h+='<p>Selecione uma espécie na lista.</p>';
 else{const sp=SP[S.sp];h+=`<h2>${sp.n}</h2><div class="stat"><div><b>${sp.sz}</b>Tamanho</div><div><b>${sp.mov||'9 m'}</b>Deslocamento</div></div><button class="btn" onclick="go(1)">Escolher ${sp.n}</button>`}
 return h+'</div></div>'}

function vClasse(){
 let h='<h2>Escolha uma classe</h2><div class="split"><div class="side">';
 CL.forEach((c,i)=>h+=`<button class="item${S.cls===i?' sel':''}" onclick="set('cls',${i})"><span>${c.n}</span></button>`);
 h+='</div><div class="detail">';
 if(S.cls===null)h+='<p>Selecione uma classe na lista.</p>';
 else{const c=CL[S.cls];h+=`<h2>${c.n}</h2><p>${CLD[c.n]}</p><div class="stat"><div><b>d${c.d}</b>Dado de vida</div><div><b>${c.s.join(' / ')}</b>Salvaguardas</div><div><b>${c.k}</b>Perícias</div></div><p>Atributo principal: ${c.p}</p><button class="btn" onclick="go(2)">Escolher ${c.n}</button>`}
 return h+'</div></div>'}

function vAntec(){
 let h='<h2>Escolha um antecedente</h2><div class="split"><div class="side">';
 BG.forEach((b,i)=>h+=`<button class="item${S.bg===i?' sel':''}" onclick="set('bg',${i})"><span>${b.n}</span></button>`);
 h+='</div><div class="detail">';
 if(S.bg===null)h+='<p>Selecione um antecedente na lista.</p>';
 else{
  const b=BG[S.bg],o=b.a.map(a=>[a,ABN[a]]);
  h+=`<h2>${b.n}</h2><p><b>Talento:</b> ${b.f}</p><p><b>Perícias:</b> ${b.s.join(' e ')}</p><p><b>Ferramenta:</b> ${b.i}</p>
  <div class="row" style="margin-top:12px"><label>Bônus de atributo<select onchange="set('mode',this.value)"><option value="21"${S.mode==='21'?' selected':''}>+2 e +1</option><option value="111"${S.mode==='111'?' selected':''}>+1 nos três</option></select></label>`;
  if(S.mode==='21')h+=`<label>+2${sel('p2',o,S.p2,"set('p2',this.value)",'Escolha')}</label><label>+1${sel('p1',o,S.p1,"set('p1',this.value)",'Escolha')}</label>`;
  h+='</div>';

  h+=`<button class="btn" style="margin-top:12px" onclick="go(3)">Escolher ${b.n}</button>`;
 }
 return h+'</div></div>'}

function vAtr(){const ass=S.method==='std'||S.method==='rnd';let h=`<h2>Valores de atributo</h2><div class="row"><label>Método<select onchange="set('method',this.value)"><option value="std"${S.method==='std'?' selected':''}>Conjunto padrão</option><option value="rnd"${S.method==='rnd'?' selected':''}>Aleatório (4d6)</option><option value="pb"${S.method==='pb'?' selected':''}>Compra de pontos</option><option value="man"${S.method==='man'?' selected':''}>Manual</option></select></label></div>`;if(S.method==='pb')h+=`<p>Pontos restantes: <b>${27-spent()}</b></p>`;if(S.method==='std'&&S.cls!==null)h+=`<p><button class="btn alt" onclick="suggest()">Sugestão para ${CL[S.cls].n}</button></p>`;if(S.method==='rnd')h+=`<p><button class="btn alt" onclick="roll6()">${S.rolled.length?'Rolar de novo':'Rolar atributos'}</button> ${S.rolled.length?'Resultado: '+S.rolled.join(', '):''}</p>`;if(ass&&S.method==='rnd'&&!S.rolled.length)h+='<p class="warn">Role os atributos.</p>';if(ass&&(S.rolled.length||S.method==='std')&&!stdOk()&&AB.some(a=>S.std[a]))h+='<p class="warn">Use cada valor uma vez.</p>';h+='<div class="ab">';AB.forEach(a=>{const t=score(a),b=bonus(a);let c='';if(ass)c=sel('s'+a,[...new Set(pool())].map(v=>[v,v]),S.std[a],`mapset('std','${a}',this.value)`,'–');else if(S.method==='pb')c=`<button class="pm" onclick="pm('${a}',-1)"${S.pb[a]<=8?' disabled':''}>−</button><b>${S.pb[a]}</b><button class="pm" onclick="pm('${a}',1)"${S.pb[a]>=15||spent()+(COST[S.pb[a]+1]-COST[S.pb[a]])>27?' disabled':''}>+</button>`;else c=`<input type="number" min="3" max="18" value="${S.man[a]}" onchange="mapset('man','${a}',this.value)">`;h+=`<div class="abc"><div>${ABN[a]}</div><div class="v">${t}</div><div class="m">mod ${fmt(mod(t))}${b?` · origem +${b}`:''}</div><div class="ctl">${c}</div></div>`});return h+'</div>'}
function bgSk(){return S.bg===null?[]:BG[S.bg].s}
function vPer(){const c=CL[S.cls];let h=`<h2>Perícias de ${c.n}</h2><p>Escolha ${c.k}. Selecionadas: ${S.skills.length}/${c.k}.</p><div class="sk">`;c.l.forEach(k=>{const lock=bgSk().includes(k),on=lock||S.skills.includes(k);h+=`<label class="${lock?'lock':''}"><input type="checkbox" ${on?'checked':''} ${lock||(!on&&S.skills.length>=c.k)?'disabled':''} onchange="togSkill('${k}')">${k} (${SK[k]})</label>`});return h+'</div>'}
function vDet(){let h='<h2>Alinhamento</h2><div class="grid">';ALN.forEach(a=>h+=`<button class="opt${S.align===a?' sel':''}" onclick="set('align','${a}')"><b>${a}</b></button>`);h+=`</div><h2 style="margin-top:16px">Idiomas</h2><p>Comum + 2. Selecionados: ${S.lang.length}/2.</p><div class="sk">`;LANG.forEach(l=>{const on=S.lang.includes(l);h+=`<label><input type="checkbox" ${on?'checked':''} ${!on&&S.lang.length>=2?'disabled':''} onchange="const i=S.lang.indexOf('${l}');if(i>=0)S.lang.splice(i,1);else if(S.lang.length<2)S.lang.push('${l}');render()">${l}</label>`});return h+'</div>'}

/* Official-style interactive sheet — protegida contra estado zerado */
function vFicha(){
 const c = S.cls!==null ? CL[S.cls] : null;
 const sp = S.sp!==null ? SP[S.sp] : null;
 const b  = S.bg!==null ? BG[S.bg] : null;
 const pb = c ? 2 : 0;
 const prof = new Set([...S.skills,...(b?b.s:[])]);
 const hp = c ? Math.max(1, c.d+mod(score('CON'))) : 0;
 const ac = c ? 10+mod(score('DES')) : 0;

    <div class="f-hp">
     <div class="cell"><span class="lbl">PV atuais</span><div class="big">${hp}</div></div>
     <div class="cell"><span class="lbl">PV máx.</span><div class="big">${hp}</div></div>
     <div class="cell" style="grid-column:1/-1"><span class="lbl">Dado de vida</span><div class="big">${c?'1d'+c.d:'0'}</div></div>
    </div>
    <div class="f-ac"><span class="lbl">Bônus prof.</span><div class="big">${fmt(pb)}</div></div>
   </div>
   <div class="box" style="display:flex;flex-direction:column;gap:6px">
    <div class="f-field clickable" onclick="openModal('align')"><span class="edit">editar</span><span class="lbl">Alinhamento</span><span class="val">${S.align||'—'}</span></div>
    <div class="f-field clickable" onclick="openModal('lang')"><span class="edit">editar</span><span class="lbl">Idiomas</span><span class="val">Comum${S.lang.length?', '+S.lang.join(', '):''}</span></div>
   </div>
  </div>

  <div class="f-mid">
   <div class="f-abilities">
    ${AB.map(a=>{
      const sc=score(a),m=mod(sc),ps=c?c.s.includes(a):false;
      return `<div class="box clickable ability" onclick="openModal('atr')">
        <span class="edit">editar</span>
        <div class="name">${ABN[a].toUpperCase()}</div>
        <div class="score">${sc}</div>
        <div class="mod">${fmt(m)}</div>
        <div class="sv"><span class="dot${ps?' p':''}"></span>salv. ${fmt(m+(ps?pb:0))}</div>

        const p=prof.has(k);return `<div class="skill-row"><span class="dot${p?' p':''}"></span><span class="nm">${k}</span><span class="bon">${fmt(mod(score(SK[k]))+(p?pb:0))}</span></div>`;

   </div>
  </div>
 </div>`;
 return h;
}

/* Modal contents */

 return `<h2>Identidade</h2>
  <label>Nome<br><input style="width:100%" value="${(S.name||'').replace(/"/g,'&quot;')}" oninput="S.name=this.value"></label>
  <p style="margin-top:12px;color:var(--mute)">Espécie, classe e origem têm seções próprias na ficha.</p>
  <div class="modal-actions"><button class="btn" onclick="closeModal()">Concluir</button></div>`;
}
function modalSp(){
 let h=`<h2>Espécie</h2>
  <div class="side" style="max-height:45vh">`;
 SP.forEach((s,i)=>{h+=`<button class="item${S.sp===i?' sel':''}" onclick="set('sp',${i})"><span>${s.n}</span></button>`});
 h+=`</div><div class="modal-actions"><button class="btn" onclick="closeModal()">Concluir</button></div>`;
 return h;
}
function modalCls(){
 let h=`<h2>Classe</h2><div class="side" style="max-height:50vh">`;
 CL.forEach((c,i)=>h+=`<button class="item${S.cls===i?' sel':''}" onclick="set('cls',${i})"><span>${c.n}</span></button>`);
 if(S.cls!==null){const c=CL[S.cls];h+=`</div><div class="info"><p>${CLD[c.n]}</p><p>d${c.d} · ${c.p}</p></div>`;}
 else h+='</div>';
 h+=`<div class="modal-actions"><button class="btn" onclick="closeModal()">Concluir</button></div>`;

}
function modalBg(){
 let h=`<h2>Antecedente</h2><div class="side" style="max-height:40vh">`;
 BG.forEach((b,i)=>h+=`<button class="item${S.bg===i?' sel':''}" onclick="set('bg',${i})"><span>${b.n}</span></button>`);
 h+='</div>';
 if(S.bg!==null){
  const b=BG[S.bg],o=b.a.map(a=>[a,ABN[a]]);

  if(S.mode==='21')h+=`<label>+2${sel('p2',o,S.p2,"set('p2',this.value)",'?')}</label><label>+1${sel('p1',o,S.p1,"set('p1',this.value)",'?')}</label>`;

 }

function modalAtr(){return `<h2>Atributos</h2>${vAtr()}<div class="modal-actions"><button class="btn" onclick="closeModal()">Concluir</button></div>`}
function modalPer(){
 if(S.cls===null)return `<h2>Perícias</h2><p>Escolha uma classe primeiro.</p><div class="modal-actions"><button class="btn" onclick="closeModal()">Fechar</button></div>`;
 return `<h2>Perícias</h2>${vPer()}<div class="modal-actions"><button class="btn" onclick="closeModal()">Concluir</button></div>`;
}
function modalAlign(){let h='<h2>Alinhamento</h2><div class="grid">';ALN.forEach(a=>h+=`<button class="opt${S.align===a?' sel':''}" onclick="set('align','${a}')"><b>${a}</b></button>`);return h+'</div><div class="modal-actions"><button class="btn" onclick="closeModal()">Concluir</button></div>'}
function modalLang(){let h=`<h2>Idiomas</h2><p>Comum + 2. Selecionados: ${S.lang.length}/2.</p><div class="sk">`;LANG.forEach(l=>{const on=S.lang.includes(l);h+=`<label><input type="checkbox" ${on?'checked':''} ${!on&&S.lang.length>=2?'disabled':''} onchange="const i=S.lang.indexOf('${l}');if(i>=0)S.lang.splice(i,1);else if(S.lang.length<2)S.lang.push('${l}');render()">${l}</label>`});return h+'</div><div class="modal-actions"><button class="btn" onclick="closeModal()">Concluir</button></div>'}
function modalDet(){return `<h2>Detalhes</h2>${vDet()}<div class="modal-actions"><button class="btn" onclick="closeModal()">Concluir</button></div>`}

function renderModal(){
 if(!S.modal){document.getElementById('modal-root').innerHTML='';return}
 const map={ident:modalIdent,sp:modalSp,cls:modalCls,bg:modalBg,atr:modalAtr,per:modalPer,det:modalDet,align:modalAlign,lang:modalLang};
 const body=(map[S.modal]||(()=>'<p>…</p>'))();
 document.getElementById('modal-root').innerHTML=`<div class="modal-bg" onclick="if(event.target===this)closeModal()"><div class="modal"><button class="close-x" onclick="closeModal()" aria-label="Fechar">×</button>${body}</div></div>`;
}

function roll6(){const r=()=>{const d=[1,2,3,4].map(()=>1+Math.floor(Math.random()*6)).sort((x,y)=>x-y);return d[1]+d[2]+d[3]};S.rolled=[0,0,0,0,0,0].map(r).sort((x,y)=>y-x);S.std={};render()}
function suggest(){if(S.cls===null)return;const t=SUG[CL[S.cls].n];if(!t)return;AB.forEach((a,i)=>S.std[a]=t[i]);render()}
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const d4=()=>{const d=[1,2,3,4].map(()=>1+Math.floor(Math.random()*6)).sort((x,y)=>x-y);return d[1]+d[2]+d[3]};
function rSp(){S.sp=Math.floor(Math.random()*SP.length)}
function rCls(){S.cls=Math.floor(Math.random()*CL.length);S.skills=[]}
function rBg(){S.bg=Math.floor(Math.random()*BG.length);S.mode=Math.random()<.5?'21':'111';const t=shuf(BG[S.bg].a);S.p2=t[0];S.p1=t[1]}
function rAtr(){if(S.method==='std'){const v=shuf(STD);S.std={};AB.forEach((a,i)=>S.std[a]=v[i])}else if(S.method==='rnd'){S.rolled=[0,0,0,0,0,0].map(d4).sort((x,y)=>y-x);const v=shuf(S.rolled);S.std={};AB.forEach((a,i)=>S.std[a]=v[i])}else if(S.method==='pb'){AB.forEach(a=>S.pb[a]=8);let pts=27;for(let g=0;g<300;g++){const a=pick(AB),n=S.pb[a]+1;if(n<=15&&COST[n]-COST[S.pb[a]]<=pts){pts-=COST[n]-COST[S.pb[a]];S.pb[a]=n}}}else AB.forEach(a=>S.man[a]=d4())}
function rPer(){if(S.cls===null)return;const c=CL[S.cls];S.skills=shuf(c.l.filter(k=>!bgSk().includes(k))).slice(0,c.k)}
function rDet(){S.align=pick(ALN.slice(0,6));S.lang=shuf(LANG).slice(0,2)}
function rand(){const f=[rSp,rCls,rBg,rAtr,rPer,rDet];f.forEach(g=>g());render()}

function escHtml(value){
 return String(value===undefined||value===null?'':value).replace(/[&<>"']/g,function(ch){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]});
}
function switchView(view){
 ACTIVE_VIEW=view;
 S.modal=null;
 ITEM_QUERY=''; MONSTER_QUERY='';
 render();
}
function updateTabs(){
 ['character','items','monsters'].forEach(function(v){
  const el=document.getElementById('tab-'+v);
  if(el)el.classList.toggle('on',ACTIVE_VIEW===v);
 });
}
function renderCharacterPage(){
 let h='<div class="panel"><div class="character-toolbar"><p>Sua ficha fica nesta área. Clique nos campos destacados para editar.</p><div class="row" style="margin:0"><button class="btn alt" onclick="rand()">Sortear personagem</button></div></div>';
 h+=vFicha();
 document.getElementById('app').innerHTML=h+'</div>';
 renderModal();
}
function itemCategoryList(){
 return ['Todas'].concat(Array.from(new Set((ITEMS||[]).map(function(x){return x.categoria||'Outros'}))).sort(function(a,b){return a.localeCompare(b,'pt-BR')}));
}
function filteredItems(){
 const q=norm(ITEM_QUERY);
 return (ITEMS||[]).map(function(item,index){return {item:item,index:index}}).filter(function(row){
  const x=row.item;
  const text=norm([x.n,x.en,x.categoria,x.tipo,x.raridade,x.preco,x.peso,x.descricao,x.uso,x.propriedades,x.maestria].filter(Boolean).join(' '));
  return (!q||text.includes(q))&&(ITEM_CATEGORY==='Todas'||(x.categoria||'Outros')===ITEM_CATEGORY);
 });
}
function itemIcon(item){
 const t=norm((item.categoria||'')+' '+(item.tipo||''));
 if(t.includes('arma'))return '⚔'; if(t.includes('armadura'))return '🛡'; if(t.includes('pocao')||t.includes('poção'))return '⚗';
 if(t.includes('ferramenta'))return '🧰'; if(item.magico)return '✦'; if(t.includes('montaria')||t.includes('veiculo'))return '🐎'; return '◇';
}
function formatItemPrice(value){
 return String(value||'Não informado').replace(/\b(CP|SP|EP|GP|PP)\b/g,c=>({CP:'PC',SP:'PP',EP:'PE',GP:'PO',PP:'PL'}[c]));
}
function formatItemWeight(value){
 return String(value||'Não especificado').replace(/\blb\b/gi,'lb (libras)');
}
function renderItemCard(row){
 const x=row.item,mag=x.magico?'Mágico':'Equipamento';
 const price=x.magico?magicPriceByRarity(x):(x.preco||'Preço não informado');
 const weight=x.peso||'Peso não especificado';
 return `<button class="catalog-card${row.index===SELECTED_ITEM_INDEX?' sel':''}" onclick="selectItem(${row.index})"><div class="card-topline"><span class="card-icon">${itemIcon(x)}</span><span class="card-tag">${escHtml(x.raridade||x.categoria||mag)}</span></div><strong>${escHtml(x.n||x.en||'Item')}</strong><small>${escHtml(x.en||x.tipo||'')}</small><div class="card-stats"><span>${escHtml(formatItemPrice(price))}</span><span>${escHtml(formatItemWeight(weight))}</span></div></button>`;
}
function magicPriceByRarity(item){
 const rarity=(item.raridade||'').toLowerCase();
 const values={'comum':100,'incomum':400,'rara':4000,'muito rara':40000,'lendária':200000,'lendaria':200000};
 if(!values[rarity])return 'Definido pelo Mestre';
 let v=values[rarity];
 const en=(item.en||'').toLowerCase();
 if(/potion|ammunition|bead|elixir|consumable/.test(en) && !/spell scroll/.test(en))v=Math.round(v/2);
 return v.toLocaleString('pt-BR')+' PO (estimativa)';
}
function weaponPropertyExplanation(item){
 const raw=String(item.propriedades||'');
 if(!raw||raw==='—')return '';
 const rules=[
  [/Acuidade/i,'Acuidade','Você pode usar Força ou Destreza nas jogadas de ataque e dano com esta arma.'],
  [/Leve/i,'Leve','Ao realizar a ação Atacar e atacar com uma arma Leve, você pode fazer um ataque extra com outra arma Leve como ação bônus no mesmo turno. Esse ataque extra não adiciona seu modificador de atributo ao dano, a menos que ele seja negativo.'],
  [/Arremesso/i,'Arremesso','Você pode arremessar a arma para realizar um ataque à distância. Se ela for uma arma corpo a corpo, use o mesmo modificador de atributo usado no ataque corpo a corpo.'],
  [/Duas mãos/i,'Duas mãos','A arma exige as duas mãos quando você faz um ataque com ela.'],
  [/Versátil/i,'Versátil','A arma pode ser usada com uma ou duas mãos. O valor entre parênteses indica o dano quando usada com as duas mãos.'],
  [/Munição/i,'Munição','Você precisa ter a munição apropriada para cada ataque à distância. Sacar a munição faz parte do ataque; ao fim do combate, você recupera metade da munição gasta se dedicar um minuto à busca.'],
  [/Carregamento/i,'Carregamento','Por causa do tempo necessário para carregar a arma, você só pode disparar uma unidade de munição por ação, ação bônus ou reação usada para dispará-la, independentemente do número de ataques que normalmente poderia fazer.'],
  [/Pesada/i,'Pesada','Criaturas Pequenas ou Miúdas têm desvantagem nas jogadas de ataque com esta arma.'],
  [/Alcance/i,'Alcance','A arma aumenta em 1,5 m o alcance que você pode atingir com ela.']
 ];
 const found=rules.filter(([rx])=>rx.test(raw));
 if(!found.length)return '';
 return '<details class="original-details"><summary>Como funcionam as propriedades</summary>'+found.map(([,name,desc])=>`<div class="detail-line"><b>${name}:</b> ${desc}</div>`).join('')+'</details>';
}
function weaponMasteryExplanation(value){
 const key=String(value||'').toLowerCase().normalize('NFD').replace(/[\\u0300-\\u036f]/g,'');
 const rules={
  'cleave':'Uma vez por turno, quando acertar uma criatura, você pode fazer um ataque corpo a corpo contra uma segunda criatura a até 1,5 m da primeira e dentro do seu alcance. Em um acerto, role o dano da arma, mas não adicione o modificador de atributo ao dano, a menos que ele seja negativo.',
  'raspar':'Se errar uma criatura com esta arma, você ainda pode causar dano a ela igual ao modificador de atributo usado na jogada de ataque. O dano é do mesmo tipo da arma.',
  'graze':'Se errar uma criatura com esta arma, você ainda pode causar dano a ela igual ao modificador de atributo usado na jogada de ataque. O dano é do mesmo tipo da arma.',
  'nick':'Quando fizer o ataque extra concedido pela propriedade Leve, você pode fazê-lo como parte da ação Atacar, em vez de uma ação bônus. Você só pode fazer esse ataque extra uma vez por turno.',
  'empurrar':'Quando acertar uma criatura com esta arma, você pode empurrá-la até 3 m para longe de você, desde que ela seja Grande ou menor.',
  'push':'Quando acertar uma criatura com esta arma, você pode empurrá-la até 3 m para longe de você, desde que ela seja Grande ou menor.',
  'sap':'Quando acertar uma criatura com esta arma, ela tem desvantagem na próxima jogada de ataque que fizer antes do início do seu próximo turno.',
  'lento':'Quando acertar uma criatura com esta arma e causar dano, o deslocamento dela é reduzido em 3 m até o início do seu próximo turno. Se acertar novamente, a redução não aumenta.',
  'slow':'Quando acertar uma criatura com esta arma e causar dano, o deslocamento dela é reduzido em 3 m até o início do seu próximo turno. Se acertar novamente, a redução não aumenta.',
  'derrubar':'Quando acertar uma criatura com esta arma, você pode forçá-la a fazer uma salvaguarda de Constituição (CD 8 + seu modificador do atributo usado no ataque + bônus de proficiência). Se falhar, ela fica Caída.',
  'topple':'Quando acertar uma criatura com esta arma, você pode forçá-la a fazer uma salvaguarda de Constituição (CD 8 + seu modificador do atributo usado no ataque + bônus de proficiência). Se falhar, ela fica Caída.',
  'vex':'Quando acertar uma criatura com esta arma e causar dano, você tem vantagem na próxima jogada de ataque contra ela antes do fim do seu próximo turno.'
 };
 return rules[key]||'';
}
function renderItemDetail(index){
 const x=ITEMS[index];
 if(!x)return '<div class="empty-state">Selecione um item para ver seus dados.</div>';
 const price=x.magico?magicPriceByRarity(x):(x.preco||'Não informado');
 const weight=x.peso||'Não especificado';
 let h=`<div class="card-topline"><span class="card-icon">${itemIcon(x)}</span><span class="card-tag">${escHtml(x.raridade||x.categoria||'Item')}</span></div><h2 style="margin-top:10px">${escHtml(x.n||x.en)}</h2><p class="detail-sub">${escHtml(x.en||'')}</p>`;
 h+=`<div class="detail-grid"><div class="detail-stat"><b>${escHtml(formatItemPrice(price))}</b><small>Preço / valor</small></div><div class="detail-stat"><b>${escHtml(formatItemWeight(weight))}</b><small>${String(weight).startsWith('Carga')?'Capacidade de carga':'Peso'}</small></div><div class="detail-stat"><b>${escHtml(x.raridade|| (x.magico?'Não informado':'—'))}</b><small>Raridade</small></div></div>`;
 if(x.tipo)h+=`<div class="detail-line"><b>Tipo:</b> ${escHtml(x.tipo)}</div>`;
 if(x.dano)h+=`<div class="detail-line"><b>Dano:</b> ${escHtml(x.dano)}</div>`;
 if(x.propriedades){h+=`<div class="detail-line"><b>Propriedades:</b> ${escHtml(x.propriedades)}</div>`;h+=weaponPropertyExplanation(x);}
 if(x.maestria){const mastery=x.maestriaDescricao||weaponMasteryExplanation(x.maestria);h+=`<div class="detail-line"><b>Maestria:</b> ${escHtml(x.maestria)}${mastery?' — '+escHtml(mastery):''}</div>`;}
 if(x.classeArmadura)h+=`<div class="detail-line"><b>Classe de Armadura:</b> ${escHtml(x.classeArmadura)}</div>`;
 if(x.forcaMinima&&x.forcaMinima!=='—')h+=`<div class="detail-line"><b>Força mínima:</b> ${escHtml(x.forcaMinima)}</div>`;
 if(x.furtividade&&x.furtividade!=='—')h+=`<div class="detail-line"><b>Furtividade:</b> ${escHtml(x.furtividade)}</div>`;
 if(x.tempoVestir)h+=`<div class="detail-line"><b>Tempo para vestir:</b> ${escHtml(x.tempoVestir)}</div>`;
 if(x.habilidade)h+=`<div class="detail-line"><b>Atributo:</b> ${escHtml(x.habilidade)}</div>`;
 if(x.sintonia)h+=`<div class="detail-line"><b>Sintonia:</b> ${escHtml(x.sintonia)}</div>`;
 if(x.cargas)h+=`<div class="detail-line"><b>Cargas:</b> ${escHtml(x.cargas)}</div>`;
 if(x.duracao)h+=`<div class="detail-line"><b>Duração:</b> ${escHtml(x.duracao)}</div>`;
 h+=`<section class="item-description"><h3>Descrição e utilização</h3><p>${escHtml(x.descricao||'Descrição ainda não disponível neste registro.')}</p>`;
 if(x.uso && !x.magico && x.uso!==x.descricao)h+=`<p><b>Uso:</b> ${escHtml(x.uso)}</p>`;
 h+='</section>';
 if(x.nota&&!x.magico)h+=`<div class="detail-note">${escHtml(x.nota)}</div>`;
 return h;
}
function updateItemResults(){
 const rows=filteredItems();
 const count=document.getElementById('items-count');
 const grid=document.getElementById('items-grid');
 const detail=document.getElementById('item-detail');
 if(rows.length && !rows.some(function(row){return row.index===SELECTED_ITEM_INDEX;}))SELECTED_ITEM_INDEX=rows[0].index;
 if(count)count.textContent=rows.length+' de '+(ITEMS||[]).length+' itens';
 if(grid)grid.innerHTML=rows.length?rows.map(renderItemCard).join(''):'<div class="empty-state">Nenhum item encontrado.</div>';
 if(detail)detail.innerHTML=renderItemDetail(SELECTED_ITEM_INDEX);
}

function selectItem(index){SELECTED_ITEM_INDEX=index;updateItemResults()}
function itemSearch(value){ITEM_QUERY=value;updateItemResults()}
function itemCategory(value){ITEM_CATEGORY=value;updateItemResults()}
function renderItemsPage(){
 const cats=itemCategoryList();
 let h=`<div class="catalog-head"><div><h2>Itens</h2><p>Explore armas, armaduras, equipamentos e itens mágicos.</p></div><span class="card-tag">${(ITEMS||[]).length} registros</span></div><div class="catalog-tools"><input type="search" placeholder="Buscar por nome, tipo ou raridade…" value="${escHtml(ITEM_QUERY)}" oninput="itemSearch(this.value)"><select onchange="itemCategory(this.value)">${cats.map(c=>`<option value="${escHtml(c)}"${c===ITEM_CATEGORY?' selected':''}>${escHtml(c)}</option>`).join('')}</select></div><div class="catalog-count" id="items-count"></div><div class="catalog-layout"><section><div class="catalog-grid" id="items-grid"></div></section><aside class="catalog-detail" id="item-detail"></aside></div>`;
 document.getElementById('app').innerHTML=h;
 updateItemResults();
 renderModal();
}
function monsterTypeList(){
 return ['Todos'].concat(Array.from(new Set((MONSTER_CACHE||[]).map(function(m){return m.tipo||'Outros'}))).sort(function(a,b){return a.localeCompare(b,'pt-BR')}));
}
function filteredMonsters(){
 const q=norm(MONSTER_QUERY);
 return MONSTER_CACHE.map(function(m,index){return {monster:m,index:index}}).filter(function(row){
  const m=row.monster;
  const hay=norm([m.nome,m.nomePt,m.nomeEn,m.tipo,m.tamanho,m.nd].filter(Boolean).join(' '));
  return (!q||hay.includes(q))&&(MONSTER_TYPE==='Todos'||m.tipo===MONSTER_TYPE);
 }).sort(function(a,b){return String(a.monster.nome||'').localeCompare(String(b.monster.nome||''),'pt-BR')});
}
function monsterAttrEntries(m){
 const a=m.atributos||{};
 const pairs=[['Força',['strength','str','for']],['Destreza',['dexterity','dex','des']],['Constituição',['constitution','con','con']],['Inteligência',['intelligence','int','int']],['Sabedoria',['wisdom','wis','sab']],['Carisma',['charisma','cha','car']]];
 return pairs.map(function(pair){let val='—';for(const key of pair[1]){if(a[key]!==undefined){val=a[key];break}}return {name:pair[0],value:val}});
}
function renderMonsterCard(row){
 const m=row.monster;
 return `<button class="catalog-card${(m.id||m.nomeEn)===SELECTED_MONSTER_ID?' sel':''}" onclick="selectMonster(${row.index})"><div class="card-topline"><span class="card-icon">♜</span><span class="card-tag">ND ${escHtml(m.nd||'—')}</span></div><strong>${escHtml(m.nome||m.nomeEn||'Criatura')}</strong><small>${escHtml(m.nomeEn||'')} · ${escHtml(m.tipo||'')}</small><div class="card-stats"><span>CA ${escHtml(m.classeArmadura??'—')}</span><span>PV ${escHtml(m.pontosVida??'—')}</span><span>${escHtml(m.tamanho||'')}</span></div></button>`;
}
function formatMonsterValue(value){
 if(value===null||value===undefined||value==='')return '—';
 if(Array.isArray(value))return value.map(formatMonsterValue).join(', ');
 if(typeof value==='object')return Object.entries(value).map(function(pair){return escHtml(pair[0])+': '+formatMonsterValue(pair[1])}).join(' · ');
 return escHtml(value);
}
function renderMonsterEntries(title,entries){
 if(!Array.isArray(entries)||!entries.length)return '';
 return `<h3>${escHtml(title)}</h3><div class="detail-entries">${entries.map(function(entry){
  if(typeof entry==='string')return `<div class="detail-entry"><p>${escHtml(entry)}</p></div>`;
  const name=entry.name||entry.title||entry.nome||'';
  const desc=entry.desc||entry.description||entry.text||entry.value||'';
  const extras=Object.keys(entry).filter(k=>!['name','title','nome','desc','description','text','value'].includes(k)).map(k=>`${escHtml(k)}: ${formatMonsterValue(entry[k])}`).join(' · ');
  return `<div class="detail-entry">${name?`<b>${escHtml(name)}</b>`:''}${desc?`<p>${escHtml(desc)}</p>`:''}${extras?`<p>${extras}</p>`:''}</div>`;
 }).join('')}</div>`;
}
function renderMonsterDetail(m){
 if(!m)return '<div class="empty-state">Clique em um monstro para abrir sua ficha.</div>';
 let h=`<div class="card-topline"><span class="card-icon">♜</span><span class="card-tag">ND ${escHtml(m.nd||'—')}</span></div><h2 style="margin-top:10px">${escHtml(m.nome||m.nomeEn)}</h2><p class="detail-sub">${escHtml(m.nomeEn||'')} · ${escHtml(m.tamanho||'')} ${escHtml(m.tipo||'')}</p><div class="detail-grid"><div class="detail-stat"><b>${escHtml(m.classeArmadura??'—')}</b><small>Classe de Armadura</small></div><div class="detail-stat"><b>${escHtml(m.pontosVida??'—')}</b><small>Pontos de Vida</small></div><div class="detail-stat"><b>${escHtml(m.nd||'—')}</b><small>Nível de Desafio</small></div></div>`;
 h+=`<div class="detail-line"><b>Iniciativa:</b> ${formatMonsterValue(m.iniciativa)}</div><div class="detail-line"><b>Deslocamento:</b> ${formatMonsterValue(m.deslocamento)}</div>`;
 h+='<h3>Atributos</h3><div class="detail-grid">'+monsterAttrEntries(m).map(function(a){return `<div class="detail-stat"><b>${escHtml(a.value)}</b><small>${escHtml(a.name)}</small></div>`}).join('')+'</div>';
 [['Salvaguardas',m.salvaguardas],['Perícias',m.pericias],['Sentidos',m.sentidos],['Idiomas',m.idiomas],['Resistências a dano',m.resistenciasDano],['Vulnerabilidades a dano',m.vulnerabilidadesDano],['Imunidades a dano',m.imunidadesDano],['Imunidades a condições',m.imunidadesCondicao]].forEach(function(pair){if(pair[1]&&((Array.isArray(pair[1])&&pair[1].length)||(!Array.isArray(pair[1])&&Object.keys(pair[1]).length)))h+=`<div class="detail-line"><b>${escHtml(pair[0])}:</b> ${formatMonsterValue(pair[1])}</div>`});
 h+=renderMonsterEntries('Características',m.tracos);
 h+=renderMonsterEntries('Ações',m.acoes);
 h+=renderMonsterEntries('Ações bônus',m.acoesBonus);
 h+=renderMonsterEntries('Reações',m.reacoes);
 h+=renderMonsterEntries('Ações lendárias',m.acoesLendarias);
 h+=`<p class="source-note">Fonte: ${escHtml(m.fonte||'SRD 5.2.1')} · Bloco aberto sob licença CC BY 4.0. Texto das regras preservado no idioma da fonte.</p>`;
 return h;
}
function updateMonsterResults(){
 const rows=filteredMonsters();
 const count=document.getElementById('monsters-count'),grid=document.getElementById('monsters-grid'),detail=document.getElementById('monster-detail');
 if(count)count.textContent=rows.length+' de '+MONSTER_CACHE.length+' criaturas';
 if(grid)grid.innerHTML=rows.length?rows.map(renderMonsterCard).join(''):'<div class="empty-state">Nenhum monstro encontrado.</div>';
 let selected=MONSTER_CACHE.find(function(m){return (m.id||m.nomeEn)===SELECTED_MONSTER_ID});
 if(rows.length && !rows.some(function(row){return (row.monster.id||row.monster.nomeEn)===SELECTED_MONSTER_ID;})){selected=rows[0].monster;SELECTED_MONSTER_ID=selected.id||selected.nomeEn;}
 if(!selected&&rows.length){selected=rows[0].monster;SELECTED_MONSTER_ID=selected.id||selected.nomeEn;}
 if(grid)grid.innerHTML=rows.map(renderMonsterCard).join('');
 if(detail)detail.innerHTML=renderMonsterDetail(selected);
}
function selectMonster(index){const m=MONSTER_CACHE[index];if(!m)return;SELECTED_MONSTER_ID=m.id||m.nomeEn;updateMonsterResults()}
function monsterSearch(value){MONSTER_QUERY=value;updateMonsterResults()}
function monsterType(value){MONSTER_TYPE=value;updateMonsterResults()}
async function renderMonstersPage(){
 const types=monsterTypeList();
 let h=`<div class="catalog-head"><div><h2>Monstros</h2><p>Selecione uma criatura para abrir sua ficha e suas ações.</p></div><span class="card-tag">${MONSTER_CACHE.length||'…'} criaturas</span></div><div class="catalog-tools"><input type="search" placeholder="Buscar monstro por nome, tipo ou ND…" value="${escHtml(MONSTER_QUERY)}" oninput="monsterSearch(this.value)"><select onchange="monsterType(this.value)">${types.map(t=>`<option value="${escHtml(t)}"${t===MONSTER_TYPE?' selected':''}>${escHtml(t)}</option>`).join('')}</select></div><div id="monsters-count" class="catalog-count">Carregando criaturas…</div><div class="catalog-layout"><section><div class="catalog-grid" id="monsters-grid"><div class="empty-state">Carregando catálogo de monstros…</div></div></section><aside class="catalog-detail" id="monster-detail"><div class="empty-state">As fichas aparecerão aqui quando o catálogo terminar de carregar.</div></aside></div><p class="source-note">Os blocos completos são os disponibilizados pelo SRD 5.2.1. O livro comercial tem criaturas adicionais que não estão integralmente neste catálogo aberto.</p>`;
 document.getElementById('app').innerHTML=h;
 renderModal();
 try{
  if(window.MONSTERS_READY)MONSTER_CACHE=await window.MONSTERS_READY;
  else MONSTER_CACHE=window.MONSTERS||[];
  if(ACTIVE_VIEW==='monsters'){
   const sel=document.querySelector('.catalog-tools select');
   if(sel){const keep=MONSTER_TYPE;sel.innerHTML=monsterTypeList().map(t=>`<option value="${escHtml(t)}"${t===keep?' selected':''}>${escHtml(t)}</option>`).join('')}
   updateMonsterResults();
   const counter=document.querySelector('.catalog-head .card-tag');if(counter)counter.textContent=MONSTER_CACHE.length+' criaturas';
  }
 }catch(e){const grid=document.getElementById('monsters-grid');if(grid)grid.innerHTML='<div class="empty-state">Não foi possível carregar os monstros. Verifique sua conexão.</div>';}
}
function render(){
 const steps=document.getElementById('steps');if(steps)steps.innerHTML='';
 updateTabs();
 if(ACTIVE_VIEW==='character')renderCharacterPage();
 else if(ACTIVE_VIEW==='items')renderItemsPage();
 else renderMonstersPage();
}
render();
</script>
